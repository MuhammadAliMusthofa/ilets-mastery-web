<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Westfield Museum — ground floor plan</title>
  <rect width="600" height="480" fill="#ffffff"/>

  <!-- Dinding luar -->
  <rect x="20" y="20" width="560" height="400" fill="#f8fafc" stroke="#334155" stroke-width="4"/>

  <!-- Ruang kiri -->
  <rect x="20" y="20" width="200" height="133" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="153" width="200" height="134" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="287" width="200" height="133" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- Ruang kanan -->
  <rect x="380" y="20" width="200" height="133" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="380" y="153" width="200" height="134" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="380" y="287" width="200" height="133" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- Ruang ujung (jauh dari pintu masuk) -->
  <rect x="220" y="20" width="160" height="110" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>

  <!-- Aula -->
  <text x="300" y="285" text-anchor="middle" font-size="16" fill="#64748b" letter-spacing="3">ENTRANCE HALL</text>

  <!-- Pintu masuk -->
  <rect x="265" y="416" width="70" height="8" fill="#ffffff"/>
  <path d="M300 468 L300 432 M288 444 L300 430 L312 444" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" dx="58">ENTRANCE</text>

  <!-- Label huruf -->
  <g font-size="30" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">
    <circle cx="120" cy="86" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="120" y="87">C</text>

    <circle cx="120" cy="220" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="120" y="221">B</text>

    <circle cx="120" cy="353" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="120" y="354">A</text>

    <circle cx="300" cy="75" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="300" y="76">D</text>

    <circle cx="480" cy="86" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="480" y="87">E</text>

    <circle cx="480" cy="220" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="480" y="221">F</text>

    <circle cx="480" cy="353" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="480" y="354">G</text>
  </g>
</svg>
